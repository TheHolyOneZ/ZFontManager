[package]
name = "zfontmanager"
version = "0.2.0"
description = "Cross-platform font manager: preview, tag, activate/deactivate, and install fonts"
authors = ["TheHolyOneZ"]
license = "GPL-3.0-only"
homepage = "https://zsync.eu/zfontmanager/"
repository = "https://github.com/TheHolyOneZ/ZFontManager"
edition = "2021"

[lib]
name = "zfontmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
walkdir = "2"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
notify = "7"
rodio = { version = "0.19", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Foundation"] }
